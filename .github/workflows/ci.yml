name: CI

# push só em main; pull_request sem filtro de base (PRs empilhados também rodam).
# Antes, cada push em branch com PR rodava o workflow duas vezes.
on:
  push:
    branches: [main]
  pull_request:

# PR: push novo cancela o run anterior do mesmo PR. Push: cada commit tem grupo
# próprio (SHA), pois o GitHub cancela run pendente do mesmo grupo mesmo com
# cancel-in-progress false — agrupar por ref faria o push do meio nunca rodar.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# FIX 3: escopo mínimo do GITHUB_TOKEN — leitura de conteúdo apenas.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    steps:
      # FIX 4: actions pinadas por SHA (tag imutável) em vez de tag flutuante.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # FIX 9: cache do Homebrew para o tesseract não ser re-baixado em todo run.
      - name: Cache Homebrew (tesseract/gitleaks)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-tesseract-v1

      - name: Instalar Tesseract (OCR) — .doc legado usa textutil nativo do macOS
        run: brew install tesseract tesseract-lang

      - name: Sincronizar dependências (uv lock commitado)
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check core/ tests/

      # FIX 6: mypy strict está configurado no pyproject; o CI não cobria.
      - name: Type check (mypy strict)
        run: uv run mypy core/

      - name: Testes
        run: uv run pytest tests/ -v --cov=core --cov-report=term-missing

      - name: Auditoria de dependências (pip-audit)
        # Audita a árvore do lock (runtime+dev) — o toolchain do runner
        # (pip/msgpack/setuptools) não é embarcado no binário.
        run: |
          uv export --frozen --no-hashes -o /tmp/reqs.txt
          uv run pip-audit -r /tmp/reqs.txt

      - name: Scan de segredos (detect-secrets)
        # Gate real: o `scan --baseline` auto-atualiza o baseline e sai 0
        # mesmo com segredo novo (vácuo). O `detect-secrets-hook` retorna 1
        # SEMPRE (também reescreve line_number/generated_at a cada run) —
        # o discriminativo é o output: "ERROR: Potential secrets" = segredo
        # novo fora do baseline → falha. Só "baseline updated" = passa.
        # uv.lock excluído como no .pre-commit-config.yaml.
        run: |
          git ls-files -z | grep -zv '^uv.lock$' | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline > /tmp/ds-out.txt 2>&1 || true
          if grep -q "ERROR: Potential secrets" /tmp/ds-out.txt; then cat /tmp/ds-out.txt; exit 1; fi

      - name: Scan de credenciais (gitleaks)
        # Chamada direta (não a action): a action falhava com
        # "stderr is not empty" em versões novas do gitleaks.
        run: |
          brew install gitleaks
          gitleaks git --no-banner --exit-code 1

  # Smoke do empacotamento: valida que o PyInstaller gera o binário e que a
  # forma canônica de CLI (args EXATOS da GUI, sem subcomando) converte.
  build:
    runs-on: macos-latest
    needs: test

    steps:
      # FIX 4: actions pinadas por SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sincronizar dependências
        run: uv sync --extra dev --frozen

      # FIX 9: mesmo cache Homebrew do job test.
      - name: Cache Homebrew (tesseract)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-tesseract-v1

      - name: Instalar Tesseract (OCR — o smoke converte PDF que requer)
        run: brew install tesseract tesseract-lang

      - name: Gerar PDF de teste
        run: |
          uv run python - <<'EOF'
          import fitz
          doc = fitz.open()
          p = doc.new_page(width=595, height=842)
          p.insert_text((50, 50), "PDF de smoke test do empacotamento CI.")
          doc.save("smoke.pdf")
          doc.close()
          EOF

      - name: Empacotar (PyInstaller one-file)
        run: uv run bash scripts/pyinstaller_cli.sh dist build

      - name: Smoke — args EXATOS da GUI (sem subcomando)
        run: |
          ./dist/pdf2md smoke.pdf saida --json | grep -q '"status": "concluido"'

      - name: Smoke — subcomando llm
        # Contrato JSON, não valor: no CI não há servidor LLM, então `ok`
        # é `false` legítimo (CLI falha com exit 0). O gate valida que o
        # binário emite o contrato (campo ok com bool) — um binário quebrado
        # (traceback, markup, JSON inválido) falha aqui.
        run: |
          ./dist/pdf2md llm testar --json | grep -qE '"ok": (true|false)'
