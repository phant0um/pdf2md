[project]
name = "pdf2md"
version = "0.6.1"
description = "Converte PDFs, imagens, Word, PPTX e planilhas em Markdown com suporte a batch e Obsidian vault"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "phant0um"}
]
keywords = ["pdf", "markdown", "ocr", "obsidian", "tesseract", "docx", "word", "pptx", "xlsx", "csv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
]

dependencies = [
    "pymupdf4llm>=0.0.17",
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.10",
    "Pillow>=12.3.0",
    "pillow-heif>=0.16.0",
    "PyYAML>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "mammoth>=1.6.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "python-docx>=1.1.0",
    "pyinstaller>=6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
pdf2md = "core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]  # B008: Typer.Argument/Option em defaults é padrão Typer

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
# Libs sem stubs (fitz, pymupdf4llm, pytesseract, mammoth, pillow_heif, yaml, openpyxl).
ignore_missing_imports = true
